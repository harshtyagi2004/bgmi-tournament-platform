<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BGMI Team Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-orange-500">📝 TEAM REGISTRATION</h1>
      <nav class="space-x-4 text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-orange-400">Dashboard</a>
        <a href="create-tournament.html" class="text-slate-400 hover:text-orange-400">Create Tournament</a>
        <a href="register.html" class="text-orange-400 border-b-2 border-orange-400 pb-1">Team Register</a>
        <a href="profile.html" class="text-slate-400 hover:text-orange-400">Player Resume</a>
      </nav>
    </header>

    <div id="tournamentBanner" class="bg-slate-800/80 p-4 rounded-xl border border-orange-500/30 flex justify-between items-center">
      <div>
        <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">Active Tournament</p>
        <h2 id="activeTourneyTitle" class="text-lg font-bold text-orange-400">Loading Active Tournament...</h2>
      </div>
      <div class="text-right">
        <span id="activeTourneyMode" class="text-xs font-extrabold bg-cyan-900 text-cyan-200 px-3 py-1 rounded-full uppercase">SQUAD</span>
      </div>
    </div>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-6">
      
      <div>
        <label class="text-xs font-bold text-orange-400 uppercase tracking-wider">Team Name *</label>
        <input id="teamName" type="text" placeholder="e.g. GodLike Esports" 
          class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-orange-500 text-sm" />
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">👑 Player 1 - Captain Details *</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="captainIgn" type="text" placeholder="Captain IGN (e.g. JONATHAN)" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500" />
          <input id="captainUid" type="text" placeholder="Captain BGMI UID (e.g. 5123456789)" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500" />
        </div>
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-cyan-400">🎯 Player 2 Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p2Ign" type="text" placeholder="Player 2 IGN" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
          <input id="p2Uid" type="text" placeholder="Player 2 BGMI UID" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
        </div>
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-cyan-400">🎯 Player 3 Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p3Ign" type="text" placeholder="Player 3 IGN" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
          <input id="p3Uid" type="text" placeholder="Player 3 BGMI UID" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
        </div>
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-cyan-400">🎯 Player 4 Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p4Ign" type="text" placeholder="Player 4 IGN" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
          <input id="p4Uid" type="text" placeholder="Player 4 BGMI UID" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
        </div>
      </div>

      <div class="bg-slate-900/40 p-4 rounded-lg border border-slate-700/50 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-purple-400">🔄 Player 5 Details (Substitute / Optional)</h3>
          <span class="text-[10px] bg-purple-900/80 text-purple-200 px-2 py-0.5 rounded uppercase font-bold">Optional</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p5Ign" type="text" placeholder="Player 5 IGN (Optional)" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-purple-500" />
          <input id="p5Uid" type="text" placeholder="Player 5 BGMI UID (Optional)" 
            class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-purple-500" />
        </div>
      </div>

      <button onclick="registerSquad()" 
        class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white p-3.5 rounded-lg font-bold transition shadow-lg active:scale-95 text-base">
        🚀 Register Team & Reserve Slot
      </button>

      <p id="regStatus" class="text-xs text-center h-4 font-semibold mt-2"></p>
    </div>

  </div>

  <script>
    let activeTournament = null;

    async function loadActiveTournament() {
      try {
        const res = await fetch('/api/tournaments/active');
        const data = await res.json();
        
        if (data.success && data.tournament) {
          activeTournament = data.tournament;
          document.getElementById('activeTourneyTitle').innerText = activeTournament.title || "BGMI Championship";
          document.getElementById('activeTourneyMode').innerText = activeTournament.mode || "SQUAD";
        } else {
          document.getElementById('activeTourneyTitle').innerText = "No Active Tournament Found";
        }
      } catch (err) {
        console.warn("Could not load active tournament:", err);
      }
    }

    async function registerSquad() {
      const teamName = document.getElementById('teamName').value.trim();
      const captainIgn = document.getElementById('captainIgn').value.trim();
      const captainUid = document.getElementById('captainUid').value.trim();
      const statusEl = document.getElementById('regStatus');

      if (!teamName || !captainIgn || !captainUid) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Team Name & Captain Details are required!";
        return;
      }

      // Collect Teammates (Player 2 to Player 5 Optional)
      const members = [];
      ['p2', 'p3', 'p4', 'p5'].forEach(id => {
        const ign = document.getElementById(`${id}Ign`).value.trim();
        const bgmiUid = document.getElementById(`${id}Uid`).value.trim();
        if (ign && bgmiUid) {
          members.push({ ign, bgmiUid });
        }
      });

      statusEl.className = "text-xs text-center font-semibold text-orange-400";
      statusEl.innerText = "⏳ Registering team & securing slot...";

      try {
        const regRes = await fetch('/api/teams/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            teamName, 
            captainIgn, 
            captainUid, 
            members, 
            tournamentId: activeTournament?._id 
          })
        });
        const regData = await regRes.json();

        if (!regRes.ok) {
          statusEl.className = "text-xs text-center font-semibold text-rose-400";
          statusEl.innerText = `❌ ${regData.error || 'Team registration failed'}`;
          return;
        }

        statusEl.className = "text-xs text-center font-semibold text-emerald-400";
        statusEl.innerText = `🎉 Team "${teamName}" Registered Successfully! Assigned Slot: #${regData.team.slotNumber}`;

      } catch (err) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Server error occurred during registration.";
      }
    }

    window.onload = loadActiveTournament;
  </script>
</body>
</html>
