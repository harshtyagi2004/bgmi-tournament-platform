<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BGMI Team Registration & Slot Locker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🎮</span>
        <h1 class="text-lg md:text-xl font-extrabold text-orange-500 tracking-wider whitespace-nowrap">
          BGMI ESPORTS
        </h1>
      </div>
      <nav class="flex items-center space-x-4 md:space-x-6 text-xs md:text-sm font-semibold whitespace-nowrap">
        <a href="index.html" class="text-slate-400 hover:text-orange-400 transition">Dashboard</a>
        <a href="register.html" class="text-orange-400 border-b-2 border-orange-400 pb-1">Team Register</a>
        <a href="profile.html" class="text-slate-400 hover:text-orange-400 transition">Player Stats</a>
        <a href="admin.html" class="bg-orange-600/20 text-orange-400 hover:bg-orange-600 hover:text-white px-3 py-1 rounded-lg border border-orange-500/30 transition">🔑 Admin Login</a>
      </nav>
    </header>

    <div id="tournamentBanner" class="bg-slate-800/90 p-5 rounded-xl border border-orange-500/40 shadow-lg flex justify-between items-center">
      <div>
        <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">Active Tournament Selected</p>
        <h2 id="activeTourneyTitle" class="text-xl font-extrabold text-orange-400 mt-0.5">Loading Active Tournament...</h2>
      </div>
      <div class="text-right">
        <span id="activeTourneyMode" class="text-xs font-bold bg-cyan-900 text-cyan-200 px-3 py-1 rounded-full uppercase">SQUAD</span>
        <p class="text-xs text-slate-400 font-bold mt-2">ENTRY FEE</p>
        <p id="activeTourneyFee" class="text-xl font-black text-emerald-400">₹0</p>
      </div>
    </div>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-6">
      
      <div>
        <label class="text-xs font-bold text-orange-400 uppercase tracking-wider">Team Name *</label>
        <input id="teamName" type="text" placeholder="e.g. GodLike Esports" 
          class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-orange-500 text-sm" />
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">👑 Player 1 - Captain Details *</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="captainIgn" type="text" placeholder="Captain IGN (e.g. JONATHAN)" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500" />
          <input id="captainUid" type="text" placeholder="Captain BGMI UID (e.g. 5123456789)" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500" />
        </div>
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-cyan-400">🎯 Player 2 Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p2Ign" type="text" placeholder="Player 2 IGN" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
          <input id="p2Uid" type="text" placeholder="Player 2 BGMI UID" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
        </div>
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-cyan-400">🎯 Player 3 Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p3Ign" type="text" placeholder="Player 3 IGN" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
          <input id="p3Uid" type="text" placeholder="Player 3 BGMI UID" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
        </div>
      </div>

      <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/80 space-y-3">
        <h3 class="text-sm font-bold text-cyan-400">🎯 Player 4 Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p4Ign" type="text" placeholder="Player 4 IGN" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
          <input id="p4Uid" type="text" placeholder="Player 4 BGMI UID" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-cyan-500" />
        </div>
      </div>

      <div class="bg-slate-900/40 p-4 rounded-lg border border-slate-700/50 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-purple-400">🔄 Player 5 Details (Substitute / Optional)</h3>
          <span class="text-[10px] bg-purple-900/80 text-purple-200 px-2 py-0.5 rounded uppercase font-bold">Optional</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="p5Ign" type="text" placeholder="Player 5 IGN (Optional)" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-purple-500" />
          <input id="p5Uid" type="text" placeholder="Player 5 BGMI UID (Optional)" class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-white text-sm focus:outline-none focus:border-purple-500" />
        </div>
      </div>

      <button id="registerBtn" onclick="registerAndPay()" 
        class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white p-3.5 rounded-lg font-bold transition shadow-lg active:scale-95 text-base">
        🚀 Register Team & Reserve Slot
      </button>

      <p id="regStatus" class="text-xs text-center h-4 font-semibold mt-2"></p>
    </div>

  </div>

  <script>
    let activeTournament = null;

    async function loadActiveTournament() {
      try {
        const res = await fetch('/api/tournaments/active');
        const data = await res.json();
        
        if (data.success && data.tournament) {
          activeTournament = data.tournament;
          document.getElementById('activeTourneyTitle').innerText = activeTournament.title || "BGMI Tournament";
          document.getElementById('activeTourneyMode').innerText = activeTournament.mode || "SQUAD";
          
          const fee = activeTournament.entryFee ?? 0;
          document.getElementById('activeTourneyFee').innerText = fee > 0 ? `₹${fee}` : "FREE";

          const btn = document.getElementById('registerBtn');
          btn.innerText = fee > 0 ? `💳 Pay ₹${fee} via UPI & Lock Squad Slot` : `🚀 Register Team & Lock Free Slot`;
        } else {
          document.getElementById('activeTourneyTitle').innerText = "No Active Tournament Found";
          document.getElementById('activeTourneyFee').innerText = "N/A";
        }
      } catch (err) {
        console.warn("Could not load active tournament:", err);
      }
    }

    async function registerAndPay() {
      const teamName = document.getElementById('teamName').value.trim();
      const captainIgn = document.getElementById('captainIgn').value.trim();
      const captainUid = document.getElementById('captainUid').value.trim();
      const statusEl = document.getElementById('regStatus');

      if (!teamName || !captainIgn || !captainUid) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Team Name & Captain Details are required!";
        return;
      }

      const members = [];
      ['p2', 'p3', 'p4', 'p5'].forEach(id => {
        const ign = document.getElementById(`${id}Ign`).value.trim();
        const bgmiUid = document.getElementById(`${id}Uid`).value.trim();
        if (ign && bgmiUid) members.push({ ign, bgmiUid });
      });

      statusEl.className = "text-xs text-center font-semibold text-orange-400";
      statusEl.innerText = "⏳ Registering squad in database...";

      try {
        // Step 1: Save Registration Data in MongoDB
        const regRes = await fetch('/api/teams/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teamName, captainIgn, captainUid, members, tournamentId: activeTournament?._id })
        });
        const regData = await regRes.json();

        if (!regRes.ok) {
          statusEl.className = "text-xs text-center font-semibold text-rose-400";
          statusEl.innerText = `❌ ${regData.error || 'Team registration failed'}`;
          return;
        }

        const fee = activeTournament ? (activeTournament.entryFee || 0) : 0;

        // FREE TOURNAMENT FLOW
        if (fee === 0) {
          statusEl.className = "text-xs text-center font-semibold text-emerald-400";
          statusEl.innerText = `🎉 Squad "${teamName}" Registered Successfully! Slot #${regData.team.slotNumber} Reserved.`;
          return;
        }

        // PAID TOURNAMENT FLOW -> TRIGGER RAZORPAY UPI
        statusEl.innerText = "⏳ Creating UPI payment order...";
        const orderRes = await fetch('/api/payments/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: fee })
        });
        const orderData = await orderRes.json();

        if (!orderData.success) {
          statusEl.className = "text-xs text-center font-semibold text-emerald-400";
          statusEl.innerText = `🎉 Squad Registered! Slot #${regData.team.slotNumber} Reserved.`;
          return;
        }

        // Step 2: Open Razorpay Checkout Window
        const options = {
          key: "rzp_test_dummy_key", // Replace with your actual Razorpay Key ID
          amount: orderData.order.amount,
          currency: "INR",
          name: "BGMI Esports Platform",
          description: `Entry Fee for ${activeTournament?.title || 'Tournament'} (Slot #${regData.team.slotNumber})`,
          order_id: orderData.order.id,
          handler: async function (response) {
            statusEl.innerText = "⏳ Verifying UPI payment...";
            await fetch('/api/payments/verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...response, teamId: regData.team._id })
            });
            statusEl.className = "text-xs text-center font-semibold text-emerald-400";
            statusEl.innerText = `🎉 Payment Verified! Slot #${regData.team.slotNumber} Locked for ${teamName}.`;
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();

      } catch (err) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Server error occurred during registration.";
      }
    }

    window.onload = loadActiveTournament;
  </script>
</body>
</html>
