<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BGMI Team Registration & Slot Locker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-orange-500">📝 TEAM REGISTRATION</h1>
      <nav class="space-x-4 text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-orange-400">Dashboard</a>
        <a href="register.html" class="text-orange-400 border-b-2 border-orange-400 pb-1">Register Team</a>
        <a href="profile.html" class="text-slate-400 hover:text-orange-400">Player Resume</a>
      </nav>
    </header>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
      <h2 class="text-lg font-bold text-slate-200">Enter Captain & Team Details</h2>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400">Team Name</label>
          <input id="teamName" type="text" placeholder="e.g. Soul Esports" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-orange-500 text-sm" />
        </div>

        <div>
          <label class="text-xs text-slate-400">Captain In-Game Name (IGN)</label>
          <input id="captainIgn" type="text" placeholder="e.g. Mortal" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-orange-500 text-sm" />
        </div>

        <div>
          <label class="text-xs text-slate-400">Captain BGMI Character UID</label>
          <input id="captainUid" type="text" placeholder="e.g. 5123456789" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-orange-500 text-sm" />
        </div>
      </div>

      <button onclick="registerAndPay()" 
        class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white p-3 rounded-lg font-bold transition shadow-md active:scale-95 text-sm mt-4">
        💳 Pay ₹50 Entry Fee & Lock Slot
      </button>

      <p id="regStatus" class="text-xs text-center h-4 font-semibold mt-2"></p>
    </div>

  </div>

  <script>
    async function registerAndPay() {
      const teamName = document.getElementById('teamName').value.trim();
      const captainIgn = document.getElementById('captainIgn').value.trim();
      const captainUid = document.getElementById('captainUid').value.trim();
      const statusEl = document.getElementById('regStatus');

      if (!teamName || !captainIgn || !captainUid) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Please fill all required details!";
        return;
      }

      statusEl.className = "text-xs text-center font-semibold text-orange-400";
      statusEl.innerText = "⏳ Registering team & generating payment request...";

      try {
        // Step 1: Register Team in Database
        const regRes = await fetch('/api/teams/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teamName, captainIgn, captainUid })
        });
        const regData = await regRes.json();

        if (!regRes.ok) {
          statusEl.className = "text-xs text-center font-semibold text-rose-400";
          statusEl.innerText = `❌ ${regData.error || 'Registration failed'}`;
          return;
        }

        // Step 2: Create Razorpay Order
        const orderRes = await fetch('/api/payments/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: 50 })
        });
        const orderData = await orderRes.json();

        if (!orderData.success) {
          statusEl.className = "text-xs text-center font-semibold text-emerald-400";
          statusEl.innerText = `✅ Team Registered! Slot Allocated: #${regData.team.slotNumber}`;
          return;
        }

        // Step 3: Trigger Razorpay Modal
        const options = {
          key: "rzp_test_dummy_key",
          amount: orderData.order.amount,
          currency: "INR",
          name: "BGMI Esports Platform",
          description: `Entry Fee for Slot #${regData.team.slotNumber}`,
          order_id: orderData.order.id,
          handler: async function (response) {
            statusEl.innerText = "⏳ Verifying payment status...";
            await fetch('/api/payments/verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...response, teamId: regData.team._id })
            });
            statusEl.className = "text-xs text-center font-semibold text-emerald-400";
            statusEl.innerText = `🎉 Payment Verified! Slot #${regData.team.slotNumber} Locked.`;
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();

      } catch (err) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Connection error during registration.";
      }
    }
  </script>
</body>
</html>
