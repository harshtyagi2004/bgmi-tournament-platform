<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Esports Gaming Resume</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-orange-500">🎮 PLAYER RESUME</h1>
      <nav class="space-x-4 text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-orange-400">Dashboard</a>
        <a href="create-tournament.html" class="text-slate-400 hover:text-orange-400">Create Tournament</a>
        <a href="register.html" class="text-slate-400 hover:text-orange-400">Team Register</a>
        <a href="profile.html" class="text-orange-400 border-b-2 border-orange-400 pb-1">Player Resume</a>
      </nav>
    </header>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
      <h2 class="text-lg font-bold text-slate-200">Search Player Stats by BGMI UID</h2>
      
      <div class="flex gap-2">
        <input id="searchUid" type="text" placeholder="Enter BGMI UID (e.g. 5123456789)" 
          class="flex-1 p-3 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm" />
        <button onclick="fetchProfile()" 
          class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 rounded-lg font-bold transition text-sm">
          🔍 Search
        </button>
      </div>
    </div>

    <div id="profileResult" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-6">
      <div class="flex items-center space-x-4 border-b border-slate-700 pb-4">
        <div class="w-16 h-16 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-full flex items-center justify-center text-2xl font-bold">
          🪖
        </div>
        <div>
          <h3 id="playerName" class="text-xl font-extrabold text-white">---</h3>
          <p id="playerUid" class="text-xs text-slate-400">UID: ---</p>
          <span class="inline-block bg-emerald-900 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded mt-1">
            VERIFIED PLAYER
          </span>
        </div>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center divide-x divide-slate-700 text-center">
        <div class="flex-1 px-2">
          <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Tournaments</p>
          <p id="statTournaments" class="text-xl md:text-2xl font-black text-amber-400 mt-1">0</p>
        </div>
        <div class="flex-1 px-2">
          <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Total Kills</p>
          <p id="statKills" class="text-xl md:text-2xl font-black text-rose-400 mt-1">0</p>
        </div>
        <div class="flex-1 px-2">
          <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Matches Won</p>
          <p id="statWins" class="text-xl md:text-2xl font-black text-emerald-400 mt-1">0</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    async function fetchProfile() {
      const uid = document.getElementById('searchUid').value.trim();
      const resultCard = document.getElementById('profileResult');

      if (!uid) return alert("Please enter a BGMI UID!");

      try {
        const res = await fetch(`/api/players/${uid}`);
        const data = await res.json();

        if (res.ok && data.player) {
          document.getElementById('playerName').innerText = data.player.ign || data.player.name || "Player";
          document.getElementById('playerUid').innerText = `UID: ${data.player.bgmiUid}`;
          document.getElementById('statTournaments').innerText = data.player.stats?.tournamentsPlayed || 0;
          document.getElementById('statKills').innerText = data.player.stats?.totalKills || 0;
          document.getElementById('statWins').innerText = data.player.stats?.wins || 0;

          resultCard.classList.remove('hidden');
        } else {
          alert("Player profile not found. Register a team first!");
          resultCard.classList.add('hidden');
        }
      } catch (err) {
        alert("Error fetching player profile.");
      }
    }
  </script>
</body>
</html>
