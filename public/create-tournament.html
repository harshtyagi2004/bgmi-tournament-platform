<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New BGMI Tournament</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-orange-500">🏆 TOURNAMENT REGISTRATION</h1>
      <nav class="space-x-4 text-sm font-semibold">
        <a href="index.html" class="text-slate-400 hover:text-orange-400">Dashboard</a>
        <a href="create-tournament.html" class="text-orange-400 border-b-2 border-orange-400 pb-1">Create Tournament</a>
        <a href="register.html" class="text-slate-400 hover:text-orange-400">Team Register</a>
        <a href="profile.html" class="text-slate-400 hover:text-orange-400">Player Resume</a>
      </nav>
    </header>

    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-5">
      <h2 class="text-lg font-bold text-orange-400">Register & Publish New Tournament</h2>
      
      <div>
        <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Tournament Title *</label>
        <input id="title" type="text" placeholder="e.g. BGMI India Championship 2026" 
          class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-orange-500 text-sm" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Game Mode *</label>
          <select id="mode" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
            <option value="SQUAD">SQUAD (4-5 Players)</option>
            <option value="DUO">DUO (2 Players)</option>
            <option value="SOLO">SOLO (1 Player)</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Max Slots Allowed *</label>
          <input id="maxSlots" type="number" placeholder="25" value="25" min="1" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Entry Fee Per Team (₹)</label>
          <input id="entryFee" type="number" placeholder="0 for Free" value="50" min="0" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-emerald-500 text-sm font-bold" />
        </div>

        <div>
          <label class="text-xs font-bold text-amber-400 uppercase tracking-wider">Total Prize Pool (₹)</label>
          <input id="prizePool" type="number" placeholder="e.g. 10000" value="5000" min="0" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-amber-500 text-sm font-bold" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-purple-400 uppercase tracking-wider">Registration Deadline</label>
          <input id="deadline" type="datetime-local" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-purple-500 text-sm" />
        </div>

        <div>
          <label class="text-xs font-bold text-purple-400 uppercase tracking-wider">Match Schedule Date & Time</label>
          <input id="schedule" type="datetime-local" 
            class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-purple-500 text-sm" />
        </div>
      </div>

      <button onclick="createTournament()" 
        class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white p-3.5 rounded-lg font-bold transition shadow-lg active:scale-95 text-base mt-2">
        🚀 Publish Tournament & Set Active
      </button>

      <p id="status" class="text-xs text-center h-4 font-semibold mt-2"></p>
    </div>

  </div>

  <script>
    async function createTournament() {
      const title = document.getElementById('title').value.trim();
      const mode = document.getElementById('mode').value;
      const maxSlots = document.getElementById('maxSlots').value;
      const entryFee = document.getElementById('entryFee').value;
      const prizePool = document.getElementById('prizePool').value;
      const registrationDeadline = document.getElementById('deadline').value;
      const schedule = document.getElementById('schedule').value;
      const statusEl = document.getElementById('status');

      if (!title) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Please enter a Tournament Title!";
        return;
      }

      statusEl.className = "text-xs text-center font-semibold text-orange-400";
      statusEl.innerText = "⏳ Registering & publishing tournament...";

      try {
        const res = await fetch('/api/tournaments/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, mode, maxSlots, entryFee, prizePool, registrationDeadline, schedule })
        });
        const data = await res.json();

        if (res.ok) {
          statusEl.className = "text-xs text-center font-semibold text-emerald-400";
          statusEl.innerText = `🎉 Tournament Created Successfully!`;
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1200);
        } else {
          statusEl.className = "text-xs text-center font-semibold text-rose-400";
          statusEl.innerText = `❌ ${data.error || 'Failed to create tournament'}`;
        }
      } catch (err) {
        statusEl.className = "text-xs text-center font-semibold text-rose-400";
        statusEl.innerText = "❌ Server error occurred.";
      }
    }
  </script>
</body>
</html>
