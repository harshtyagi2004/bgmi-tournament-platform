<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create Tournament - BGMI Esports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 sm:p-6 font-sans antialiased">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🏆</span>
        <h1 class="text-base sm:text-xl font-extrabold text-orange-500 tracking-wider">
          HOST TOURNAMENT
        </h1>
      </div>
      <nav class="flex items-center space-x-4 text-xs sm:text-sm font-semibold">
        <a href="admin.html" class="text-slate-400 hover:text-orange-400 transition">⚙️ Admin Panel</a>
        <a href="index.html" class="text-slate-400 hover:text-orange-400 transition">📊 Dashboard</a>
      </nav>
    </header>

    <form id="createForm" onsubmit="handleCreateTournament(event)" class="bg-slate-800 p-5 sm:p-8 rounded-2xl border border-orange-500/30 shadow-2xl space-y-5">
      
      <div class="border-b border-slate-700 pb-3">
        <h2 class="text-lg font-bold text-orange-400">🏆 Host New BGMI Tournament</h2>
        <p class="text-xs text-slate-400">Fill in tournament rules, prize pool, entry fee & YOUR UPI ID for direct player payments.</p>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Tournament Title *</label>
        <input id="title" type="text" required placeholder="e.g. BGMI Weekly Battle Series Season 1" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white text-xs sm:text-sm focus:outline-none focus:border-orange-500" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Game Mode *</label>
          <select id="mode" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white text-xs sm:text-sm focus:outline-none focus:border-orange-500">
            <option value="SQUAD" selected>SQUAD (4 Players)</option>
            <option value="DUO">DUO (2 Players)</option>
            <option value="SOLO">SOLO (1 Player)</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Max Slots (Teams) *</label>
          <input id="maxSlots" type="number" value="25" min="1" max="100" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white text-xs sm:text-sm focus:outline-none focus:border-orange-500" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Entry Fee Per Squad (₹) *</label>
          <input id="entryFee" type="number" min="0" value="50" placeholder="0 for Free Tournament" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-amber-400 font-bold text-xs sm:text-sm focus:outline-none focus:border-orange-500" />
        </div>

        <div>
          <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Total Prize Pool (₹) *</label>
          <input id="prizePool" type="number" min="0" value="1000" placeholder="e.g. 5000" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-emerald-400 font-bold text-xs sm:text-sm focus:outline-none focus:border-orange-500" />
        </div>
      </div>

      <div class="p-4 bg-emerald-950/40 rounded-xl border border-emerald-500/40 space-y-2">
        <label class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
          💳 YOUR UPI ID FOR RECEIVING PAYMENTS *
        </label>
        <p class="text-[11px] text-slate-300">Players will scan a QR Code generated with THIS UPI ID. Payments go directly to your Bank Account!</p>
        <input id="upiId" type="text" required placeholder="e.g. 9876543210@paytm OR yourname@okicici" class="w-full p-3 bg-slate-900 rounded-lg border border-slate-700 text-amber-300 font-mono text-xs sm:text-sm focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Registration Deadline</label>
          <input id="registrationDeadline" type="datetime-local" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white text-xs focus:outline-none focus:border-orange-500" />
        </div>

        <div>
          <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Match Start Schedule Date & Time</label>
          <input id="schedule" type="datetime-local" class="w-full p-3 mt-1 bg-slate-900 rounded-lg border border-slate-700 text-white text-xs focus:outline-none focus:border-orange-500" />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white p-3.5 rounded-xl font-extrabold transition shadow-lg text-sm sm:text-base active:scale-95">
        🚀 Publish Tournament & Generate Unique Share Link
      </button>

      <p id="formStatus" class="text-xs text-center font-bold h-4"></p>
    </form>

  </div>

  <script>
    async function handleCreateTournament(e) {
      e.preventDefault();
      const statusEl = document.getElementById('formStatus');
      const submitBtn = document.getElementById('submitBtn');

      const title = document.getElementById('title').value.trim();
      const mode = document.getElementById('mode').value;
      const maxSlots = document.getElementById('maxSlots').value;
      const entryFee = document.getElementById('entryFee').value;
      const prizePool = document.getElementById('prizePool').value;
      const upiId = document.getElementById('upiId').value.trim();
      const registrationDeadline = document.getElementById('registrationDeadline').value;
      const schedule = document.getElementById('schedule').value;
      const token = localStorage.getItem('adminToken');

      if (!title || !upiId) {
        statusEl.className = "text-xs text-center font-bold text-rose-400";
        statusEl.innerText = "❌ Please enter Tournament Title and YOUR UPI ID!";
        return;
      }

      statusEl.className = "text-xs text-center font-bold text-amber-400";
      statusEl.innerText = "⏳ Publishing tournament...";
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/tournaments/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title, mode, maxSlots, entryFee, prizePool, upiId,
            registrationDeadline, schedule, token
          })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          statusEl.className = "text-xs text-center font-bold text-emerald-400";
          statusEl.innerText = `✅ Tournament Published Successfully! Redirecting...`;
          
          setTimeout(() => {
            window.location.href = `admin.html`;
          }, 1500);
        } else {
          statusEl.className = "text-xs text-center font-bold text-rose-400";
          statusEl.innerText = `❌ ${data.error || 'Failed to create tournament'}`;
          submitBtn.disabled = false;
        }
      } catch (err) {
        statusEl.className = "text-xs text-center font-bold text-rose-400";
        statusEl.innerText = "❌ Server communication error.";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
